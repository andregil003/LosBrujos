<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D2 · Proceso legal Decreto 33-2024</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF8;--card:#FFFFFF;--ink:#111111;--muted:#6B7280;--line:#E5E7EB;--accent:#2563EB;--accent-soft:#EFF6FF;--green:#059669;--green-soft:#ECFDF5;--red:#DC2626;--red-soft:#FEF2F2;--amber:#D97706;--amber-soft:#FFFBEB;--radius:10px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;padding:24px;}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
h1{font-size:clamp(20px,3vw,28px);font-weight:700;letter-spacing:-0.02em;line-height:1.15;max-width:820px;}
.sub{font-size:13px;color:var(--muted);margin-top:6px;}
button.export{font-family:inherit;font-weight:600;font-size:13px;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;transition:opacity .15s;}
button.export:hover{opacity:.85;}
main{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;overflow-x:auto;}
svg{display:block;width:100%;height:auto;}
.node{cursor:pointer;}
.node rect{transition:fill .18s ease,stroke .18s ease,filter .18s ease;}
.node:hover rect{filter:brightness(.96);}
.node:hover .node-label{fill:var(--accent);}
.node-label{transition:fill .18s ease;}
.hint{opacity:.55;transition:opacity .18s ease;}
.node:hover .hint{opacity:1;}
.arrow{stroke-dasharray:6 5;animation:flow 1s linear infinite;}
@keyframes flow{to{stroke-dashoffset:-11;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.node{animation:fadeUp .45s ease both;}
.backdrop{position:fixed;inset:0;background:rgba(17,17,17,.35);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:40;}
.backdrop.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;height:100dvh;width:min(400px,92vw);background:#fff;border-left:1px solid var(--line);transform:translateX(105%);transition:transform .3s cubic-bezier(.32,.72,.28,1);z-index:50;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.08);}
.drawer.open{transform:none;}
.drawer-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.drawer-head h2{font-size:18px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;}
.drawer-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 6px;border-radius:6px;}
.drawer-close:hover{color:var(--ink);background:var(--bg);}
.drawer-body{padding:20px 22px;overflow-y:auto;font-size:14px;line-height:1.65;color:#333;}
.drawer-body p{margin-bottom:12px;}
.facts{margin:14px 0;padding:0;list-style:none;}
.facts li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.5;}
.facts li b{min-width:118px;color:var(--ink);font-weight:600;}
.source{margin-top:16px;font-size:12px;color:var(--muted);font-style:italic;}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:10px;letter-spacing:.02em;}
footer{margin-top:16px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
.legend{display:flex;align-items:center;gap:8px;}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid var(--line);}
@media (max-width:640px){body{padding:14px;}main{padding:8px;}.drawer{width:100vw;}}
</style>
</head>
<body>
<header>
  <div>

  </div>

</header>
<main>
<svg viewBox="0 0 1200 820" width="1200" height="820" xmlns="http://www.w3.org/2000/svg" font-family="'Inter',sans-serif">

  <g class="node" data-key="infraccion" tabindex="0" role="button" style="animation-delay:.03s">

  <!-- 4 -->
  <g class="node" data-key="impugnacion" tabindex="0" role="button" style="animation-delay:.28s">

  <line x1="827" y1="452" x2="827" y2="520" stroke="#9CA3AF" stroke-width="1.5" class="arrow" marker-end="url(#arr)"/>

  <!-- SEMÁFORO -->

    <text x="358" y="744" font-size="13" font-weight="600" fill="#B91C1C">días para pagar</text>

    <text x="618" y="762" font-size="11" fill="#047857">si no te notifican</text>
    <text x="774" y="736" font-size="13" fill="#059669" class="hint">＋</text>

<script>
const INFO={
infraccion:{chip:"Paso 1",title:"Ocurre la infracción",body:"Un agente de tránsito levanta la remisión. La evidencia (foto o video) es obligatoria como respaldo de la multa.",facts:[["Montos","Q200 (sin tarjeta de circulación) a Q25,000 (conducir ebrio)"],["Evidencia","Foto / video / documentos de respaldo"],["Dato","53% de las multas son a motociclistas"]],source:"reto5-multas-transito.md §1.4 · §2.3"},
notificacion:{chip:"Paso 2",title:"Notificación obligatoria",body:"La autoridad DEBE notificar directamente al conductor o dueño antes de cobrar. Puede ser impresa o electrónica. Sin notificación, no se puede exigir el pago.",facts:[["Contenido","Fecha, lugar, pruebas, monto, forma de pago, explicación de la infracción y cómo impugnar"],["Cambio clave","Antes del Decreto se podía cobrar sin avisar"],["Impacto","Ataca el problema #1: las 'multas fantasmas'"]],source:"reto5-multas-transito.md §2.1 · §2.3"},
decision:{chip:"Paso 3",title:"¿Te notificaron en 120 días?",body:"La prescripción se cuenta desde la fecha de la infracción. Si la autoridad no notifica en 120 días, la multa prescribe y no puede cobrarse.",facts:[["Plazo","120 días desde la infracción"],["Efecto","Multas no acreditadas se anulan de oficio"],["Dato","Muchas multas 'fantasma' prescriben sin que el ciudadano lo sepa"]],source:"reto5-multas-transito.md §2.4"},
prescribe:{chip:"A favor del ciudadano",title:"PRESCRIBE",body:"Si la multa no se notificó en 120 días, prescribe y no puede cobrarse. Las multas que no puedan acreditarse conforme al decreto se anulan de oficio.",facts:[["Plazo","120 días sin notificación"],["Efecto","No puede cobrarse"],["Acción","El ciudadano puede esperar la prescripción en lugar de pagar"]],source:"reto5-multas-transito.md §2.4"},
impugnar15:{chip:"Plazo crítico",title:"15 días para impugnar",body:"Al recibir la notificación, el conductor tiene 15 días para ejercer su derecho de defensa. Es el plazo que la mayoría de ciudadanos no conoce y se pierde por falta de información.",facts:[["Plazo","15 días desde la notificación"],["Recursos","Revocatoria (misma autoridad) · Reposición (autoridad superior)"],["Antes del decreto","Eran solo 5 días (Decreto 119-96)"],["Dato","La notificación debe explicar cómo impugnar"]],source:"reto5-multas-transito.md §2.2 · §3"},
impugnacion:{chip:"Paso 4",title:"Impugnación presentada",body:"El recurso se presenta ante la autoridad que dictó la resolución. El prototipo genera un borrador del escrito con los datos de la boleta.",facts:[["Dónde","Ante la misma autoridad (revocatoria) o la superior (reposición)"],["Documentos","Boleta, DPI, pruebas de respaldo"],["Constraint","El prototipo NO presenta la impugnación: genera el borrador"]],source:"reto5-multas-transito.md §3.2"},
resolucion:{chip:"Paso 5",title:"Resolución",body:"La autoridad resuelve la impugnación. El resultado define si pagas o quedas solvente.",facts:[["Favorable","Multa anulada de oficio, conductor solvente"],["Desfavorable","Pago en máximo 60 días desde que la resolución queda firme"]],source:"reto5-multas-transito.md §2.5"},
anulada:{chip:"A favor del ciudadano",title:"MULTA ANULADA",body:"Si la resolución es favorable, la multa se anula de oficio y el conductor queda solvente.",facts:[["Efecto","Solvente, sin deuda"],["Dato","El ciudadano no tiene que hacer nada más"]],source:"reto5-multas-transito.md §2.5"},
pagar60:{chip:"Obligación de pago",title:"60 días para pagar",body:"Si la resolución es desfavorable, el infractor debe pagar en un plazo no mayor a 60 días a partir de que la resolución quede firme.",facts:[["Plazo","60 días desde resolución firme"],["Si no pagas","La deuda sigue y puede escalar"],["Dato","El semáforo del prototipo te avisa antes de que venza"]],source:"reto5-multas-transito.md §2.5"},
plazo15:{chip:"Semáforo",title:"15 días · impugnar",body:"Plazo para ejercer el derecho de defensa desde la notificación. En el prototipo se muestra en amarillo: es corto y crítico.",facts:[["Color","Amarillo — atención"],["Consejo","Impugna apenas recibas la notificación"]],source:"reto5-multas-transito.md §2.2"},
plazo60:{chip:"Semáforo",title:"60 días · pagar",body:"Plazo para pagar tras una resolución desfavorable firme. En el prototipo se muestra en rojo: es una obligación.",facts:[["Color","Rojo — obligación"],["Consejo","Programa el pago antes del vencimiento"]],source:"reto5-multas-transito.md §2.5"},
plazo120:{chip:"Semáforo",title:"120 días · prescripción",body:"Si no te notifican en 120 días desde la infracción, la multa prescribe. En el prototipo se muestra en verde: es tu derecho.",facts:[["Color","Verde — a tu favor"],["Consejo","No pagues una multa que nunca te notificaron"]],source:"reto5-multas-transito.md §2.4"},
"nota-legal":{chip:"Nota legal",title:"Validez de la notificación",body:"La notificación debe incluir el procedimiento para impugnar y los plazos. Si la autoridad no incluye esta información, hay argumento para cuestionar la validez.",facts:[["Requisito","Explicar cómo impugnar y el plazo"],["Consecuencia","Omisión = argumento de defensa"]],source:"reto5-multas-transito.md §3.2"}
};
const drawer=document.getElementById('drawer'),backdrop=document.getElementById('backdrop');
function openDrawer(key){const d=INFO[key];if(!d)return;document.getElementById('d-chip').textContent=d.chip;document.getElementById('d-title').textContent=d.title;document.getElementById('d-body').textContent=d.body;const ul=document.getElementById('d-facts');ul.innerHTML='';d.facts.forEach(([k,v])=>{const li=document.createElement('li');const b=document.createElement('b');b.textContent=k;li.appendChild(b);li.appendChild(document.createTextNode(v));ul.appendChild(li);});document.getElementById('d-source').textContent='Fuente: '+d.source;drawer.classList.add('open');backdrop.classList.add('open');drawer.setAttribute('aria-hidden','false');}
function closeDrawer(){drawer.classList.remove('open');backdrop.classList.remove('open');drawer.setAttribute('aria-hidden','true');}
document.querySelectorAll('.node').forEach(n=>{n.addEventListener('click',()=>openDrawer(n.dataset.key));n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDrawer(n.dataset.key);}});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
function exportPNG(){const svg=document.querySelector('svg');const xml=new XMLSerializer().serializeToString(svg);const url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width*2;c.height=img.height*2;const ctx=c.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const a=document.createElement('a');a.download=document.title+'.png';a.href=c.toDataURL('image/png');a.click();};img.src=url;}
</script>
</body>
