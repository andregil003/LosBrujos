r2:{chip:"Resultado",title:"Entiende Su Multa",body:"El ciudadano sabe qué hizo mal, cuánto debe, y puede tomar una decisión informada. En su propio idioma, con explicaciones simples.",facts:[["Antes","Jerga legal incomprensible"],["Ahora","Explicación en lenguaje claro"],["Idioma","En su lengua materna"],["Decisión","Informada, no por miedo"]],source:"reto5-multas-transito.md §6.2"},
p3:{chip:"Problema",title:"No Sé Si Puedo Pelear",body:"El Decreto 33-2024 garantiza el derecho a impugnar en 15 días, pero la mayoría de ciudadanos no sabe que este derecho existe ni cómo ejercerlo.",facts:[["Derecho","Impugnar en 15 días (Decreto 33-2024)"],["Realidad","La mayoría no sabe que puede pelear"],["Consecuencia","Muchos pagan multas que podrían impugnar"],["Plazo","Se pierde en 15 días sin action"]],source:"reto5-multas-transito.md §5.3 · §2.2"},
s3:{chip:"Solución",title:"Genera Recurso de Impugnación",body:"El prototipo genera un borrador PDF del recurso de impugnación con los datos del ciudadano y la multa. Incluye checklist de documentos y countdown del plazo.",facts:[["Formato","PDF generado en el dispositivo (jsPDF)"],["Contenido","Datos del ciudadano + multa + argumento"],["Checklist","Documentos necesarios"],["Plazo","Countdown visible de los 15 días"]],source:"reto5-multas-transito.md §14.3 · §6.2"},
r3:{chip:"Resultado",title:"Ejerce Su Derecho",body:"El ciudadano imprime o envía el recurso de impugnación. Si la multa era injusta, puede ahorrar Q300+ y cumple el plazo de 15 días.",facts:[["Acción","Imprime o envía el recurso"],["Ahorro","Q300+ si impugna exitosamente"],["Plazo","Cumple los 15 días"],["Disclaimer","'Este es un borrador. Consulte con un abogado'"]],source:"reto5-multas-transito.md §14.3"},

decreto:{chip:"Oportunidad",title:"Decreto 33-2024 — la ventana perfecta",body:"El Decreto 33-2024 crea una ventana única: la ley ya exige notificación + explicación + plazos, pero no hay herramienta que facilite esto. El prototipo demuestra que la interoperabilidad propuesta por la Iniciativa 6626 es viable y necesaria.",facts:[["Ley","Decreto 33-2024 — reformas a Ley de Tránsito"],["Exige","Notificación + explicación + plazos"],["No hay","Herramienta que facilite el cumplimiento"],["Iniciativa","6626 — Ley de Interoperabilidad del Gobierno Digital"],["Dato","El prototipo es un ejemplo vivo de interoperabilidad"]],source:"reto5-multas-transito.md §2 · §9.2 · §13.2"}

const drawer=document.getElementById('drawer'),backdrop=document.getElementById('backdrop');
function openDrawer(key){const d=INFO[key];if(!d)return;document.getElementById('d-chip').textContent=d.chip;document.getElementById('d-title').textContent=d.title;document.getElementById('d-body').textContent=d.body;const ul=document.getElementById('d-facts');ul.innerHTML='';d.facts.forEach(([k,v])=>{const li=document.createElement('li');const b=document.createElement('b');b.textContent=k;li.appendChild(b);li.appendChild(document.createTextNode(v));ul.appendChild(li);});document.getElementById('d-source').textContent='Fuente: '+d.source;drawer.classList.add('open');backdrop.classList.add('open');drawer.setAttribute('aria-hidden','false');}
function closeDrawer(){drawer.classList.remove('open');backdrop.classList.remove('open');drawer.setAttribute('aria-hidden','true');}
document.querySelectorAll('.node').forEach(n=>{n.addEventListener('click',()=>openDrawer(n.dataset.key));n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDrawer(n.dataset.key);}});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
function exportPNG(){const svg=document.querySelector('svg');const xml=new XMLSerializer().serializeToString(svg);const url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width*2;c.height=img.height*2;const ctx=c.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const a=document.createElement('a');a.download=document.title+'.png';a.href=c.toDataURL('image/png');a.click();};img.src=url;}
</script>
